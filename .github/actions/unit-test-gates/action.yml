name: Unit test agent gates
description: Runs gates G0 to G7 on the agent's patch, with the input prepared before the agent ran, and uploads gates.json.
inputs:
  gate-args:
    description: Extra arguments for tools/src/cli/gates.ts, for example the mutation flags
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
    - name: Install dependencies
      shell: bash
      run: |
        npm ci --prefix backend
        npm ci --prefix frontend
        npm ci --prefix tools
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: unit-test-agent-input
        path: .unit-test-agent
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: unit-test-agent-data
        path: /tmp/agent-data
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: agent
        path: /tmp/agent-artifact
    - name: Run gates G1 to G7
      shell: bash
      env:
        GATE_ARGS: ${{ inputs.gate-args }}
      run: |
        # The agent's own output is decisions.json; everything else it left in its workspace is ignored.
        if [ -f /tmp/agent-data/decisions.json ]; then cp /tmp/agent-data/decisions.json .unit-test-agent/decisions.json; fi
        count="$(find /tmp/agent-artifact -maxdepth 1 -name 'aw-*.patch' | wc -l)"
        if [ "$count" -gt 1 ]; then echo "expected at most one agent patch, found $count"; exit 1; fi
        patch="$(find /tmp/agent-artifact -maxdepth 1 -name 'aw-*.patch')"
        # GATE_ARGS is set by the workflow source, never by the PR, so word splitting is intended.
        # shellcheck disable=SC2086
        node tools/src/cli/gates.ts --patch "$patch" $GATE_ARGS
    - name: Upload gate results
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: unit-test-agent-gates
        path: .unit-test-agent/gates.json
        if-no-files-found: ignore
