name: Unit test agent report
description: Renders the report from the prepared input and gates.json, then publishes the comment and the check run. The caller checks out trusted code first.
inputs:
  agent:
    description: Result of the agent job
    required: true
  detection:
    description: Result of the threat detection job
    required: true
  gates:
    description: Result of the gates job
    required: true
  push:
    description: Result of the safe_outputs job
    required: true
  pull-number:
    description: Pull request to comment on; empty when there is none
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
    - name: Install tools
      shell: bash
      run: npm ci --prefix tools
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      continue-on-error: true
      with:
        name: unit-test-agent-input
        path: .unit-test-agent
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      continue-on-error: true
      with:
        name: unit-test-agent-gates
        path: .unit-test-agent
    - name: Render report
      shell: bash
      run: |
        if [ -f .unit-test-agent/input.json ] && [ -f .unit-test-agent/gates.json ]; then node tools/src/cli/report.ts; fi
    - name: Publish comment and check run
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        RESULTS: ${{ toJSON(inputs) }}
      with:
        script: |
          const publishReport = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-report.cjs`);
          const inputs = JSON.parse(process.env.RESULTS);
          const results = { agent: inputs.agent, detection: inputs.detection, gates: inputs.gates, push: inputs.push };
          await publishReport({ github, context, core, results, pullNumber: inputs['pull-number'] });
